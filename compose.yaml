name: dejaview

services:
  # Infrastructure profile: PostgreSQL, Qdrant, MinIO.
  postgres:
    profiles: [infra]
    image: postgres:${POSTGRES_TAG:-16.11}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dejaview}
      POSTGRES_USER: ${POSTGRES_USER:-dejaview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dejaview_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-57432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - dejaview-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    profiles: [infra]
    image: qdrant/qdrant:${QDRANT_TAG:-v1.19.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-57433}:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - dejaview-network
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3

  minio:
    profiles: [infra]
    image: quay.io/minio/minio:${MINIO_TAG:-RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dejaview}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dejaview_local_only}
    ports:
      - "127.0.0.1:${MINIO_PORT:-57434}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-57435}:9001"
    volumes:
      - minio-data:/data
    networks:
      - dejaview-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-time initialization container that creates the configured MinIO bucket.
  minio-init:
    profiles: [infra]
    image: quay.io/minio/mc:${MINIO_MC_TAG:-RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-profile-photos}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dejaview}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dejaview_local_only}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - dejaview-network

  # Application profile: infrastructure and application containers.
  backend:
    profiles: [app]
    image: ghcr.io/dejaview-nsu/dejaview-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-dejaview}
      POSTGRES_USER: ${POSTGRES_USER:-dejaview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dejaview_local_only}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-dejaview}:${POSTGRES_PASSWORD:-dejaview_local_only}@postgres:5432/${POSTGRES_DB:-dejaview}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dejaview}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dejaview_local_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-profile-photos}
      INFERENCE_URL: ${INFERENCE_URL:-http://ml:8000}
      PORT: "8081"
      
      APP_URL: ${APP_URL}
      API_URL: ${API_URL:-}

      SMTP_URL: ${SMTP_URL}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}

      OIDC_YANDEX_CLIENT_ID: ${OIDC_YANDEX_CLIENT_ID:-}
      OIDC_YANDEX_CLIENT_SECRET: ${OIDC_YANDEX_CLIENT_SECRET:-}

      OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}

      OIDC_VK_CLIENT_ID: ${OIDC_VK_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-57436}:8081"
    networks:
      - dejaview-network

  frontend:
    profiles: [app]
    image: ghcr.io/dejaview-nsu/dejaview-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-57437}:5173"
    networks:
      - dejaview-network

  # Optional GPU-only inference; activate together with app profile.
  ml:
    profiles: [ml]
    image: ghcr.io/dejaview-nsu/dejaview-ml:${ML_TAG:-latest}
    restart: unless-stopped
    environment:
      INFERENCE_PORT: "8000"
      MODELS_DIR: /models
      HF_HOME: /models/huggingface
      CUDA_VISIBLE_DEVICES: "0"
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ml-models:/models
    depends_on:
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - dejaview-network

volumes:
  pg-data:
  qdrant-storage:
  minio-data:
  ml-models:

networks:
  dejaview-network:
    driver: bridge