name: dejaview

services:
  # Infrastructure profile: PostgreSQL, Qdrant, MinIO.
  postgres:
    profiles: [infra]
    image: postgres:${POSTGRES_TAG:-16.11}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dejaview}
      POSTGRES_USER: ${POSTGRES_USER:-dejaview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-57432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - dejaview-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    profiles: [infra]
    image: qdrant/qdrant:${QDRANT_TAG:-v1.19.1}
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    ports:
      - "${QDRANT_PORT:-57433}:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - dejaview-network
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3

  minio:
    profiles: [infra]
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dejaview}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_PORT:-57434}:9000"
      - "${MINIO_CONSOLE_PORT:-57435}:9001"
    volumes:
      - minio-data:/data
    networks:
      - dejaview-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-time initialization container that creates the configured MinIO bucket.
  minio-init:
    profiles: [infra]
    image: docker.io/pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-profile-photos}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dejaview}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - dejaview-network

  # Application profile: infrastructure and application containers.
  backend:
    profiles: [app]
    image: ghcr.io/dejaview-nsu/dejaview-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-dejaview}
      POSTGRES_USER: ${POSTGRES_USER:-dejaview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-dejaview}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dejaview}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dejaview}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-profile-photos}
      ML_URL: ${ML_URL:-http://ml:8000}
      PORT: "8081"
      
      APP_URL: ${APP_URL:-}
      API_URL: ${API_URL:-${APP_URL:-}}

      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}

      OIDC_YANDEX_CLIENT_ID: ${OIDC_YANDEX_CLIENT_ID:-}
      OIDC_YANDEX_CLIENT_SECRET: ${OIDC_YANDEX_CLIENT_SECRET:-}

      OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}

      OIDC_VK_CLIENT_ID: ${OIDC_VK_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-57436}:8081"
    networks:
      - dejaview-network

  frontend:
    profiles: [app]
    image: ghcr.io/dejaview-nsu/dejaview-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-57437}:5173"
    networks:
      - dejaview-network

  nginx-bootstrap:
    profiles: [tls-bootstrap]
    image: nginx:alpine
    restart: "no"

    ports:
      - "80:80"

    volumes:
      - ./nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 2s
      retries: 10

  nginx:
    profiles: [tls]
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dejaview-network
    command:
    - /bin/sh
    - -c
    - |
      (while true; do
        sleep 21600
        nginx -s reload
      done) &
      exec nginx -g 'daemon off;'

  certbot:
    profiles: [tls]
    image: certbot/certbot:${CERTBOT_TAG:-v5.8.0}
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          certbot renew --webroot -w /var/www/certbot
          sleep 43200
        done

  # Optional ML inference service; uses GPU when available, otherwise falls back to CPU.
  ml:
    profiles: [ml]
    image: ghcr.io/dejaview-nsu/dejaview-ml:${ML_TAG:-latest}
    restart: unless-stopped
    environment:
      ML_DEVICE: auto
      ML_CACHE_DIR: /models/huggingface
      ML_QDRANT_URL: http://qdrant:6333
      ML_QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      ML_IMAGE_ENABLED: ${ML_IMAGE_ENABLED:-true}
      ML_VIDEO_ENABLED: ${ML_VIDEO_ENABLED:-true}
      ML_TEXT_ENABLED: ${ML_TEXT_ENABLED:-false}
      ML_AUDIO_ENABLED: ${ML_AUDIO_ENABLED:-false}
    volumes:
      - ml-models:/models
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - dejaview-network

volumes:
  pg-data:
  qdrant-storage:
  minio-data:
  ml-models:
  certbot-certs:
  certbot-webroot:

networks:
  dejaview-network:
    driver: bridge
