# Rate-limit:
# authenticated user -> session cookie
# guest -> IP address
map $cookie_dv_session $rate_limit_key {
    default "session:$cookie_dv_session";
    ""      "ip:$binary_remote_addr";
}

limit_req_zone $rate_limit_key zone=api_rate_limit:10m rate=100r/m;

server {
    listen 80;
    server_name dev.deja-view.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dev.deja-view.ru;

    ssl_certificate     /etc/letsencrypt/live/dev.deja-view.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.deja-view.ru/privkey.pem;

    # Allows valid 50 MB video uploads with multipart overhead.
    client_max_body_size 64m;

    # API
    location /api/v1/ {
        limit_req zone=api_rate_limit;
        limit_req_status 429;

        proxy_pass http://backend:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:5173;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}