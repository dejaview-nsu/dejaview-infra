server {
    listen 80;
    server_name dev.deja-view.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 503;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
